name: Verdigris matched 20M log-query comparison

on:
  push:
    branches: [codex/perf-comparator-20m]

permissions:
  contents: read

jobs:
  comparison:
    strategy:
      fail-fast: false
      matrix:
        include:
          - trial: 2
            engine_order: clickhouse victorialogs vdg
          - trial: 3
            engine_order: victorialogs vdg clickhouse
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the integrated release image
        run: docker build -f bench/Dockerfile.vdg -t verdigris-comparator-20m:local .
      - name: Compare equal-budget deployments on one runner
        env:
          VDG_SKIP_BUILD: '1'
          TOTAL_CPUS: '4'
          ROWS: '20000000'
          BATCH_ROWS: '50000'
          VDG_IMAGE: verdigris-comparator-20m:local
          ITERATIONS: '100'
          WARMUP: '10'
          RESTART: '1'
          CORPUS_TS_MS: '1795764240000'
          ENGINE_ORDER: ${{ matrix.engine_order }}
          RESULT_ROOT: ${{ runner.temp }}/verdigris-comparator-20m
        run: |
          set -o pipefail
          mkdir -p "$RESULT_ROOT"
          failures=0
          printf '%s\n' "$ENGINE_ORDER" > "$RESULT_ROOT/engine-order.txt"
          read -r -a engines <<< "$ENGINE_ORDER"
          for engine in "${engines[@]}"; do
            if ! SYSTEMS="$engine" OUT="$RESULT_ROOT/$engine" bench/compare/logs/run.sh |
              tee "$RESULT_ROOT/$engine.log"; then
              failures=1
            fi
          done
          exit "$failures"
      - name: Upload the three deployments and first-query samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verdigris-comparator-20m-${{ matrix.trial }}
          path: ${{ runner.temp }}/verdigris-comparator-20m
          retention-days: 7
