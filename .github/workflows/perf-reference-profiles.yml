name: Verdigris four-CPU reference profiles

on:
  push:
    branches: [codex/perf-reference-profiles]

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the integrated release image
        run: docker build -f bench/Dockerfile.vdg -t verdigris-reference-profiles:local .
      - name: Pull the pinned benchmark fixture images
        run: |
          set -o pipefail
          sed -nE 's/^(MINIO|MC|BUSYBOX)=//p' bench/compare/logs/run-profile.sh |
            while IFS= read -r image; do docker pull "$image" || exit; done
      - name: Profile the three fresh 1M reference fixtures
        env:
          VDG_IMAGE: verdigris-reference-profiles:local
          SERVICE_CPUS: '2'
          ROWS: '1000000'
          ITERATIONS: '100'
          WARMUP: '10'
          CORPUS_TS_MS: '1795764240000'
          RAW: ${{ runner.temp }}/verdigris-reference-profiles
        run: |
          mkdir -p "$RAW"
          for i in 1 2 3; do
            OUT="$RAW/trial-$i" bench/compare/logs/run-profile.sh
          done
      - name: Upload raw timings and physical plans
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verdigris-reference-profiles
          path: ${{ runner.temp }}/verdigris-reference-profiles
          retention-days: 7
