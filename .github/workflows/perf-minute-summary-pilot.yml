name: Verdigris minute-summary audit diagnostic

on:
  push:
    branches: [codex/perf-minute-summary-audit]

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - trial: audit
            rows: 20000000
            batch: 50000
            order: raw summary
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and pull the fixed fixture images
        run: |
          docker build -f bench/Dockerfile.vdg -t verdigris-minute-pilot:local .
          sed -nE 's/^(MINIO|MC|BUSYBOX)=//p' bench/compare/logs/run-profile.sh |
            while IFS= read -r image; do docker pull "$image" || exit; done
      - name: Measure production writer, compaction and reads
        env:
          VDG_IMAGE: verdigris-minute-pilot:local
          SERVICE_CPUS: '2'
          CORPUS_TS_MS: '1795764240000'
          ITERATIONS: '100'
          WARMUP: '10'
          ROWS: ${{ matrix.rows }}
          BATCH_ROWS: ${{ matrix.batch }}
          PILOT_ORDER: ${{ matrix.order }}
          ROOT: ${{ runner.temp }}/verdigris-minute-pilot
        run: |
          set -o pipefail
          mkdir -p "$ROOT"
          printf '%s\n' "$PILOT_ORDER" > "$ROOT/arm-order.txt"
          failures=0
          read -r -a arms <<< "$PILOT_ORDER"
          for arm in "${arms[@]}"; do
            pilot=off
            if [[ "$arm" == summary ]]; then pilot=on; fi
            MINUTE_SUMMARY_PILOT="$pilot" OUT="$ROOT/$arm" bench/compare/logs/run-profile.sh || failures=1
          done
          if (( failures == 0 )); then
            python3 -B bench/compare/logs/check-minute-summary-pilot.py "$ROOT" | tee "$ROOT/decision.json" || failures=1
          fi
          exit "$failures"
      - name: Upload raw storage, timing and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verdigris-minute-pilot-${{ matrix.rows }}-trial-${{ matrix.trial }}
          path: ${{ runner.temp }}/verdigris-minute-pilot
          retention-days: 7
