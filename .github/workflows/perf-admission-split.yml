name: Verdigris reserved permit experiment

on:
  push:
    branches: [codex/perf-admission-split]

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the experiment image
        run: docker build -f bench/Dockerfile.vdg -t verdigris-admission-split:local .
      - name: Test one and two reserved permits on the same host
        env:
          VDG_IMAGE: verdigris-admission-split:local
          RESULT_ROOT: ${{ runner.temp }}/verdigris-admission-split
        run: |
          mkdir -p "$RESULT_ROOT"
          for cheap in 1 2; do
            CHEAP_PERMITS="$cheap" OUT="$RESULT_ROOT/cheap-$cheap" bench/admission/run-fixed.sh
          done
      - name: Upload both treatment arms
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verdigris-admission-split
          path: ${{ runner.temp }}/verdigris-admission-split
          retention-days: 7
