name: Sustained ingest preload smoke
on:
  push:
    branches: [codex/perf-ingest-reference]
permissions:
  contents: read
jobs:
  preload:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Build benchmark binaries
        run: |
          docker build -f bench/Dockerfile.vdg -t verdigris-preload:local .
          git show 08a44183ca44606dbb5b56c3a80210650c3cc866:crates/core/src/text.rs > crates/core/src/text.rs
          docker build -f bench/Dockerfile.vdg -t verdigris-preload:control .
          git restore -- crates/core/src/text.rs
          cargo build --locked --release --manifest-path bench/loadgen/Cargo.toml
      - name: Verify preload isolation and restart recovery
        env:
          VDG_IMAGE: verdigris-preload:local
          VDG_CPUS: '3'
          MINIO_CPUS: '1'
          VDG_BENCH_ALLOW_PRELOAD: '1'
          PROFILE_INGEST_PHASES: "1"
          VDG_BENCH_PRELOAD_ROWS: '12000000'
          ROWS_PER_S: '10000'
          DURATION_SECS: '30'
          OUT: ${{ runner.temp }}/verdigris-preload
        run: |
          export CORPUS_START_MS=$(date +%s%3N)
          root="$OUT"
          export LOADGEN="$PWD/bench/loadgen/target/release/verdigris-loadgen"
          for arm in optimized-first control-first control-second optimized-second compacted; do
            export OUT="$root/$arm"
            target=0
            image=verdigris-preload:local
            case "$arm" in
              control-*) image=verdigris-preload:control ;;
              compacted) target=256 ;;
            esac
            VDG_IMAGE="$image" PRELOAD_COMPACT_MIB="$target" bench/loadgen/run-sustained.sh
            jq -e '.passed and .acked_rows == 300000' "$OUT/recovery.json"
            grep -Fx 'preloaded 12000000 rows' "$OUT/preload.log"
            jq -e '[.visibility[] | select(.visible_ms != null)] | length > 0 and all(.[]; .ack_to_visible_ms >= 0 and .ack_to_visible_ms <= .visible_ms)' "$OUT/run.json"
            jq . "$OUT/preload-storage.json"
          done
          head -n 1 "$root/"*/preload-manifest.txt
          cat "$root/compacted/preload-compaction.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verdigris-preload-smoke
          path: ${{ runner.temp }}/verdigris-preload
          retention-days: 7
