name: Sustained ingest preload smoke
on:
  push:
    branches: [codex/perf-ingest-reference]
permissions:
  contents: read
jobs:
  preload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build benchmark binaries
        run: |
          docker build -f bench/Dockerfile.vdg -t verdigris-preload:local .
          cargo build --locked --release --manifest-path bench/loadgen/Cargo.toml
      - name: Verify preload isolation and restart recovery
        env:
          VDG_IMAGE: verdigris-preload:local
          VDG_CPUS: '3'
          MINIO_CPUS: '1'
          VDG_BENCH_ALLOW_PRELOAD: '1'
          VDG_BENCH_PRELOAD_ROWS: '100000'
          ROWS_PER_S: '10000'
          DURATION_SECS: '30'
          OUT: ${{ runner.temp }}/verdigris-preload
        run: |
          root="$OUT"
          export LOADGEN="$PWD/bench/loadgen/target/release/verdigris-loadgen"
          for target in 0 256; do
            export OUT="$root/$target"
            PRELOAD_COMPACT_MIB="$target" bench/loadgen/run-sustained.sh
            grep -Fx 'preloaded 100000 rows' "$OUT/preload.log"
            jq -e '[.visibility[] | select(.visible_ms != null)] | length > 0 and all(.[]; .ack_to_visible_ms >= 0 and .ack_to_visible_ms <= .visible_ms)' "$OUT/run.json"
            jq . "$OUT/preload-storage.json"
          done
          cat "$root/256/preload-compaction.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verdigris-preload-smoke
          path: ${{ runner.temp }}/verdigris-preload
          retention-days: 7
