name: Verdigris three-engine row identity smoke

on:
  push:
    branches: [codex/perf-comparator-row-identity]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check every fixture row identity across three engines
        env:
          VERIFY_ALL_ROW_IDS: '1'
          TOTAL_CPUS: '4'
          ROWS: '100000'
          ITERATIONS: '5'
          OUT: ${{ runner.temp }}/verdigris-comparator-identity
        run: bench/compare/logs/run.sh
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verdigris-comparator-identity
          path: ${{ runner.temp }}/verdigris-comparator-identity
          retention-days: 7
