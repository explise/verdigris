# MkDocs Material config for the Verdigris documentation site.
#
# The docs source lives in docs/ with the code so it never drifts. CI deploys
# the site to https://explise.github.io/verdigris/ on every push to main that
# touches docs/ or this file (.github/workflows/docs.yml) — no manual publish.
# Local preview: mkdocs serve
site_name: Verdigris
site_description: >-
  S3-native log storage and query engine in Rust: compacted Parquet in the
  operator's own bucket, queried in place with DataFusion, with a sans-I/O
  control plane built for deterministic simulation testing.
site_url: https://explise.github.io/verdigris/
docs_dir: docs
site_dir: site

repo_url: https://github.com/explise/verdigris
repo_name: explise/verdigris
copyright: Verdigris · Apache-2.0

exclude_docs: |
  /overrides/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false # All three typefaces share one request in extra.css.
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: material/github

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets

# Don't fail the build on cross-links that point at repo files not in the site.
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - Home: index.md
  - Guides:
      - Quickstart: getting-started.md
      - Install on EKS: install.md
      - Sending logs: sending-logs.md
      - Querying: querying.md
      - Cost & tiering: cost.md
      - FAQ: faq.md
  - Reference:
      - HTTP API: API.md
      - Configuration: configuration.md
  - Internals:
      - Architecture: ARCHITECTURE.md
      - Testing (DST): dst-architecture.md
      - Ingest load test & calibration: load-test.md
      - Decision Records:
          - Overview: adr/README.md
          - "ADR-0002 · Manifest as Iceberg stand-in": adr/0002-manifest-as-iceberg-standin.md
          - "ADR-0003 · Ingest / query role split": adr/0003-ingest-query-role-split.md
      - Deployment (chart internals): deployment.md
  - Contributing: contributing.md
